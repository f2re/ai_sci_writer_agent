name: Scientific workflow quality

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**'
      - 'agents/**'
      - 'skills/**'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.cursor/**'
      - '.github/copilot-instructions.md'
      - '.windsurf/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
        mcp: ['mcp>=1.28,<2', 'mcp>=2,<3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-21
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[publishing,mcp]' '${{ matrix.mcp }}'
      - run: python -m unittest discover -s tests -v
      - run: sci-writer doctor

  real-languagetool:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      languagetool:
        image: erikvl87/languagetool:6.8
        ports:
          - 8010:8010
        env:
          Java_Xms: 256m
          Java_Xmx: 1g
          langtool_maxTextLength: '20000'
          langtool_maxCheckTimeMillis: '20000'
        options: >-
          --health-cmd "curl --fail --silent http://localhost:8010/v2/languages"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 45s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/integration_languagetool.py --url http://127.0.0.1:8010 --output ci-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-languagetool-report
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

